services:
  - type: web
    name: match4marriage-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: match4marriage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://match4marriage.com

databases:
  - name: match4marriage-db
    plan: free
    databaseName: match4marriage
    user: match4marriage
