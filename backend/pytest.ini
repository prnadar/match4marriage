[pytest]
asyncio_mode = auto
# pytest-asyncio 0.24+: pin loop scope to session so session-scoped
# fixtures (test_engine, Redis pool) stay on the same loop they were
# created on. Without this the engine connects on a loop that's then
# closed between tests → 'Event loop is closed' at teardown.
asyncio_default_fixture_loop_scope = session
testpaths = tests
addopts = --cov=app --cov-report=term-missing
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
